# ccache configuration for Neon Oubliette
# Optimized for Precompiled Headers (PCH) and Link Time Optimization (LTO)
# This file is used as a directory-local configuration via CCACHE_CONFIGPATH in CMake.

# Allow caching even if headers have absolute paths or minor timestamp differences
# pch_defines, time_macros, and include_file_mtime are critical for high PCH hit rates.
sloppiness = pch_defines,time_macros,include_file_mtime

# Ensure the base directory is set for relative paths in the hash
# (Though we also set CCACHE_BASEDIR in CMake, having it here is a good fallback)
# base_dir = .
